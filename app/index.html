<!DOCTYPE html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BKK Sidekick">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bangkok Sidekick · Rama 9 Base</title>
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home" aria-label="Go to Home"><img class="logo" src="icons/logo.svg" alt="" width="22" height="30"><span>Bangkok Sidekick</span><span class="edition" id="edition"></span><small class="ver" id="ver"></small></a>
  <button id="theme-btn" class="theme-btn" type="button" aria-pressed="false" aria-label="Switch to dark mode"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="currentColor"/></svg></button>
</div></header>
<!-- Keep the nav OUTSIDE the header: backdrop-filter on an ancestor makes position:fixed children anchor to it, hiding the tab bar on iPhone. -->
<button id="update-btn" class="update-btn" type="button" hidden></button>
<nav id="nav" aria-label="Sections"></nav>
<main id="view" tabindex="-1"></main>
<div id="modal" class="modal" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
<script src="update.js"></script>
</body>
